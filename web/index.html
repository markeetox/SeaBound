<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Seabound Fishing & Marine Intelligence App.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seabound">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Seabound</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #03112B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #03112B url('assets/assets/ui/home_bg.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }
    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
      text-align: center;
    }
    .splash-logo {
      width: 110px;
      height: 110px;
      max-width: 110px;
      max-height: 110px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin-bottom: 20px;
      filter: drop-shadow(0px 8px 24px rgba(0, 229, 255, 0.35));
    }
    .splash-subtitle {
      color: #00E5FF;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0 0 20px 0;
      text-shadow: 0px 2px 8px rgba(0, 0, 0, 0.9);
      min-height: 24px;
      transition: opacity 0.3s ease-in-out;
      opacity: 1;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 229, 255, 0.2);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-content">
      <img class="splash-logo" src="icons/logo.png" width="110" height="110" style="width: 110px; height: 110px; max-width: 110px; max-height: 110px; object-fit: contain; aspect-ratio: 1 / 1;" alt="Seabound" />
      <div id="splash-subtitle" class="splash-subtitle">Raising anchor...</div>
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    (function() {
      var phrases = [
        "Raising anchor...",
        "Prepping the cooler...",
        "Getting ice...",
        "Rigging the lines...",
        "Checking tide charts...",
        "Scanning buoy data...",
        "Baiting hooks...",
        "Charting the course...",
        "Setting the compass...",
        "Checking weather radar..."
      ];
      var currentIndex = Math.floor(Math.random() * phrases.length);
      var subEl = document.getElementById('splash-subtitle');
      if (subEl) {
        subEl.textContent = phrases[currentIndex];
        setInterval(function() {
          currentIndex = (currentIndex + 1) % phrases.length;
          subEl.style.opacity = '0';
          setTimeout(function() {
            subEl.textContent = phrases[currentIndex];
            subEl.style.opacity = '1';
          }, 150);
        }, 1000);
      }
    })();

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function () {
          splash.remove();
        }, 600);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
