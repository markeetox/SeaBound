<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Seabound Fishing & Marine Intelligence App.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Seabound">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Seabound</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #03112B;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #03112B url('assets/assets/ui/home_bg.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splash::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }
    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      text-align: center;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      max-width: 140px;
      max-height: 140px;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      filter: drop-shadow(0px 8px 24px rgba(0, 229, 255, 0.35));
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-content">
      <img class="splash-logo" src="icons/logo.png" width="140" height="140" style="width: 140px; height: 140px; max-width: 140px; max-height: 140px; object-fit: contain; aspect-ratio: 1 / 1;" alt="Seabound" />
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        splash.style.pointerEvents = 'none';
        setTimeout(function () {
          splash.remove();
        }, 600);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
