name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Set up Node.js for Firestore Rules Emulator Tests
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firestore Rules Test Dependencies
        run: npm --prefix test/firestore_rules ci || npm --prefix test/firestore_rules install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run Firestore Rules Emulator Tests
        run: firebase emulators:exec --only firestore --project seabound-test-project "npm --prefix test/firestore_rules test"

      - name: Build Web Release
        run: flutter build web --release
